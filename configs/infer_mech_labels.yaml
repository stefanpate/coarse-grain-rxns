defaults:
  - filepaths: filepaths
  - production: all_data_0
  - override hydra/job_logging: custom
  - _self_

training: ${production.training}
data: ${production.data}
model: ${production.model}

hydra:
  run:
    dir: ${filepaths.artifacts}/pred_conf/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: True
  sweep:
    dir: ${filepaths.artifacts}/pred_conf/${now:%Y-%m-%d}/${now:%H-%M-%S}
  sweeper:
    params:
      production: all_data_0,all_data_1,all_data_2,all_data_3,all_data_4