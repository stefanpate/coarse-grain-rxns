defaults:
  - filepaths: filepaths
  - _self_

rule_set: rc_plus_0_rules

hydra:
  run:
    dir: ${filepaths.rules}
  job:
    chdir: True
  sweep:
    dir: ${filepaths.rules}
    subdir: .
  sweeper:
    params:
      rule_set: >-
        mechinferred_dt_035_rules_before_2015_direct_mcsa_only,
        mechinferred_dt_059_rules_before_2015_direct_mcsa_only,
        mechinferred_dt_106_rules_before_2015_direct_mcsa_only,
        mechinferred_dt_244_rules_before_2015_direct_mcsa_only,
        mechinferred_dt_961_rules_before_2015_direct_mcsa_only
        