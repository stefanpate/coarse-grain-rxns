defaults:
  - filepaths: filepaths
  - _self_

mapped_rxns_fn: mapped_known_reactions_x_rc_plus_0_rules.parquet

hydra:
  run:
    dir: ${filepaths.rules}
  job:
    chdir: True
  sweep:
    dir: ${filepaths.rules}
    subdir: .
  sweeper:
    params:
      mapped_rxns_fn: >-
        mapped_known_reactions_x_rc_plus_0_rules_before_2015.parquet,
        mapped_known_reactions_x_rc_plus_1_rules_before_2015.parquet,
        mapped_known_reactions_x_rc_plus_2_rules_before_2015.parquet,
        mapped_known_reactions_x_rc_plus_3_rules_before_2015.parquet,
        mapped_known_reactions_x_rc_plus_4_rules_before_2015.parquet,
        mapped_known_reactions_x_mechinferred_dt_005_rules_before_2015.parquet,
        mapped_known_reactions_x_mechinferred_dt_009_rules_before_2015.parquet,
        mapped_known_reactions_x_mechinferred_dt_021_rules_before_2015.parquet,
        mapped_known_reactions_x_mechinferred_dt_069_rules_before_2015.parquet,
        mapped_known_reactions_x_mechinferred_dt_932_rules_before_2015.parquet,
        mapped_known_reactions_x_mechinformed_rules_before_2015.parquet,
        mapped_known_reactions_x_imt_rules_before_2015.parquet